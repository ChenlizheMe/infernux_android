org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Windows accounts and project folders may contain non-ASCII characters (for
# example a localized user profile). AGP's path warning is not an error for the
# generated host project, and refusing the build would make those projects
# unexportable.
android.overridePathCheck=true
